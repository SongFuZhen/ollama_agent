<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地 Agent 客户端</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>本地 Agent 客户端</h1>
    <div id="status">启动中…</div>
    <button id="settings-btn" class="hdr-btn">设置</button>
  </header>

  <nav id="tabs"></nav>

  <div id="layout">
    <!-- 文件浏览器（左栏） -->
    <aside id="file-panel">
      <div class="panel-head">
        <span>项目文件</span>
        <button id="fs-refresh" class="mini">刷新</button>
      </div>
      <div id="file-tree">加载中…</div>
      <div class="panel-hint">点文件：插入路径到输入框</div>
    </aside>

    <main>
      <div id="messages"></div>
    </main>
  </div>

  <footer>
    <textarea id="input" placeholder="输入任务，或 Ctrl+V 粘贴图片（图片识别页）。也可从左侧点文件插入路径"></textarea>
    <button id="send">发送</button>
  </footer>

  <!-- 设置弹窗 -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><span>设置（存于浏览器本地）</span><button id="settings-close" class="mini">关闭</button></div>
      <label>Ollama 地址<input id="set-ollama" type="text" placeholder="http://localhost:11434"></label>
      <label>代码模型<input id="set-coder" type="text"></label>
      <label>排查模型<input id="set-debug" type="text"></label>
      <label>通用模型<input id="set-general" type="text"></label>
      <label>图片模型<input id="set-vision" type="text"></label>
      <div class="modal-actions">
        <button id="settings-save" class="hdr-btn">保存</button>
        <span id="settings-msg" class="hint"></span>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
